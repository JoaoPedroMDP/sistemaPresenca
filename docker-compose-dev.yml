services:
  back:
    env_file:
      - ./back/.env
    build: 
      context: ./back
      dockerfile: ../docker/Dockerfile.back
    volumes:
      - back_static:/app/staticfiles
      - ./docker/back_entrypoint.sh:/app/back_entrypoint.sh
      # Diretório, não arquivo: se não existir o Docker cria um diretório
      # vazio e o Django sobe normalmente (a trava fica no entrypoint)
      - ./data:/app/data
      - ./back/media:/app/media
      - ./back/logs:/app/logs
    environment:
      - UV_PROJECT_ENVIRONMENT=/app/.venv
      - APP_VERSION=${APP_VERSION}
      - DJANGO_DB_NAME=/app/data/db.sqlite3
    healthcheck:
      # Só TCP: um GET passaria pelo ALLOWED_HOSTS e poderia ficar
      # unhealthy para sempre se localhost não estiver na lista
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  front:
    build: 
      context: ./front
      dockerfile: ../docker/Dockerfile.front
      additional_contexts:
        - repo-root=.
    volumes:
      - ./front_build:/mnt/front
    depends_on:
      - back

  caddy:
    image: caddy:2.10
    depends_on:
      back:
        condition: service_healthy
      front:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
      - "3000:3000"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - back_static:/app/staticfiles
      - ./back/media:/app/media
      - ./front_build:/app/front

volumes:
  back_static:
    driver: local