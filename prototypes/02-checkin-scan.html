<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in — Jovens AV</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  /* Espelha o <style> de routes/checkin/[code]/+page.svelte */
  #main {
    position: relative; padding: 1rem; height: 100dvh;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    overflow: hidden; background: var(--white);
  }
  #content { display: flex; flex-direction: column; align-items: center;
             transform: scale(1); transition: transform .7s cubic-bezier(.49,-0.43,.65,.83); }
  #content[data-success="true"] { transform: scale(0); }

  #main:before {
    z-index: 0; content: ''; width: 10px; height: 10px; border-radius: 50%;
    position: absolute; background-color: transparent;
    transform: scale(1); transition: transform 1.5s ease-in-out; overflow: hidden;
  }
  #main[data-success="true"]:before {
    background-color: var(--emerald-500); transform: scale(250);
  }

  #select { display: flex; flex-direction: column; color: var(--indigo-900); z-index: 10; gap: .35rem; }

  #points {
    position: absolute; bottom: -5%; color: #000; font-size: 1.5rem;
    transform: scale(1);
    transition: bottom 1.5s cubic-bezier(.29,.85,.66,.99),
                transform 1.6s cubic-bezier(.5,.52,.69,.61);
  }
  #points[data-success="true"] {
    transform: scale(2); bottom: 50%; animation: fadeOut 1s ease-in-out 1.5s;
  }
  @keyframes fadeOut { to { opacity: 0; } }
</style>
</head>
<body>

<div id="main" data-success="false">
  <div id="content" data-success="false">
    <label id="select">
      <span class="label-text">Quem é?</span>
      <select id="member" class="select">
        <option value="">—</option>
      </select>
      <span id="error" class="error-text hidden"></span>
    </label>
    <button id="submit" class="btn" disabled onclick="checkin()">Marcar presença</button>
  </div>
  <span id="points" data-success="false">+ 100pts</span>
</div>

<script src="assets/app.js"></script>
<script>
  stampVersion();

  const sel = document.getElementById('member');
  // GET /api/checkin/pending/<code> — só quem ainda não marcou hoje
  MEMBERS.slice(3).forEach(m => {
    const o = document.createElement('option');
    o.value = m.id; o.textContent = m.name;
    sel.appendChild(o);
  });

  sel.addEventListener('change', () => {
    document.getElementById('submit').disabled = !sel.value;
  });

  function checkin() {
    // POST /api/checkin/<code>/<member_id>
    document.getElementById('main').dataset.success = 'true';
    document.getElementById('content').dataset.success = 'true';
    document.getElementById('points').dataset.success = 'true';
    // No app, após 3s redireciona para o quiz externo
  }

</script>
</body>
</html>
