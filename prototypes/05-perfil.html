<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil — Jovens AV</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  .page { display: flex; flex-direction: column; align-items: center; padding: 0 2.5rem 2rem; }
  .profile-card { display: flex; flex-direction: column; gap: 1rem; align-items: center;
                  padding: 1rem; width: 100%; max-width: 640px; }
  .avatar-btn { position: relative; border: none; background: none; padding: 0;
                border-radius: var(--radius-full); cursor: pointer; }
  .avatar-btn img {
    width: 150px; height: 150px; object-fit: cover; border-radius: var(--radius-full);
    border: 2px solid var(--indigo-900);
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px var(--emerald-500);
    transition: opacity .2s;
  }
  .avatar-btn:hover img { opacity: .7; }
  .avatar-btn .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-full); background: rgba(0,0,0,.3);
    color: #fff; font-size: 1.5rem; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .avatar-btn:hover .overlay { opacity: 1; }

  .history {
    display: flex; flex-direction: column; align-items: center;
    padding: 1rem; border: 1px solid var(--indigo-900);
    border-radius: var(--radius-xl); width: 100%; max-width: 640px; gap: .5rem; margin-top: 1rem;
  }
  .event-head {
    position: relative; display: flex; flex-direction: column; font-size: 1.125rem;
    background: var(--emerald-500); border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
    padding: .5rem; width: 100%; text-align: center; color: #000;
  }
  .event-head .score-badge {
    position: absolute; right: 0; top: -.5rem; background: var(--indigo-900);
    padding: 0 .375rem; border-radius: 1rem 1rem 0 1rem; color: #fff; font-size: .875rem;
  }
  .event-dates {
    display: flex; flex-direction: column; padding: .5rem .75rem;
    border-radius: 0 0 var(--radius-2xl) var(--radius-2xl);
    background: var(--indigo-900); width: 100%; text-align: center; color: #fff;
  }
</style>
</head>
<body>

<!-- routes/(auth)/+layout.svelte -->
<nav class="navbar">
  <span class="brand">Jovens AV</span>
  <div class="row gap-4">
    <a href="05-perfil.html">Perfil</a>
    <button onclick="location.href='04-login.html'">Sair</button>
  </div>
</nav>

<div id="checking" class="center" style="height:80dvh">
  <span class="title-md">Verificando autenticação...</span>
</div>

<div id="page" class="page hidden">
  <div class="profile-card">
    <button class="avatar-btn" onclick="openCrop()" aria-label="Alterar foto de perfil">
      <img id="avatar" src="assets/profileAzul.png" alt="Foto de perfil">
      <span class="overlay">📷</span>
    </button>
    <h1 class="title-lg text-center" id="member-name">João Pedro</h1>
    <div class="row items-center gap-4 title-md" style="color:#000">
      <span>🎂</span>
      <span>14/03/1999</span>
    </div>
    <span class="muted">joaopedro</span>
  </div>

  <div class="history">
    <span class="title-md" style="align-self:flex-start;font-size:1.25rem;color:#000">Histórico de Presença:</span>
    <div id="history-list" style="width:100%"></div>
  </div>
</div>

<!-- Modal de recorte da foto (PhotoSelector.svelte) -->
<div id="crop" class="modal-backdrop hidden">
  <span style="color:#fff;font-size:.875rem;opacity:.7">
    Arraste para reposicionar · Pinça para redimensionar
  </span>
  <canvas id="crop-canvas" width="480" height="360"
          style="border-radius:var(--radius-xl);max-width:min(90vw,500px)"></canvas>
  <div class="row gap-3">
    <button class="btn" style="background:var(--gray-500);border-color:var(--gray-500);border-radius:var(--radius-full)"
            onclick="closeCrop()">Cancelar</button>
    <button class="btn btn-emerald" style="border-radius:var(--radius-full)"
            onclick="closeCrop()">Confirmar</button>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
  stampVersion();

  // GET /api/checkin/history + GET /api/score/per-event
  const HISTORY = {
    'Escola Sabatina': { score: 450, dates: ['2026-09-06T08:52', '2026-08-30T08:47', '2026-08-23T09:05'] },
    'Culto Jovem':     { score: 120, dates: ['2026-09-05T19:30', '2026-08-29T19:28'] },
  };

  document.getElementById('history-list').innerHTML = Object.entries(HISTORY)
    .map(([name, e]) => `
      <div class="event-head">
        <h2>${name}</h2>
        <span class="score-badge">${e.score} pts</span>
      </div>
      <div class="event-dates">
        ${e.dates.map(d => `<span class="font-courier">${
          new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })
        }</span>`).join('')}
      </div>`).join('');

  // Desenha um recorte circular falso no canvas do modal
  function drawCrop() {
    const c = document.getElementById('crop-canvas');
    const ctx = c.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, c.width, c.height);
    grad.addColorStop(0, '#4338ca'); grad.addColorStop(1, '#10b981');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath();
    ctx.rect(0, 0, c.width, c.height);
    ctx.arc(c.width / 2, c.height / 2, 110, 0, Math.PI * 2, true);
    ctx.fill('evenodd');
    ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(c.width / 2, c.height / 2, 110, 0, Math.PI * 2); ctx.stroke();
  }

  // O layout (auth) checa a sessão antes de desenhar a página
  setTimeout(() => {
    document.getElementById('checking').classList.add('hidden');
    document.getElementById('page').classList.remove('hidden');
  }, 700);

  function openCrop()  { document.getElementById('crop').classList.remove('hidden'); drawCrop(); }
  function closeCrop() { document.getElementById('crop').classList.add('hidden'); }

</script>
</body>
</html>
